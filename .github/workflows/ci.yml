name: M3E CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Build, Doctor, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build m3eui package and static showcase
        run: pnpm build

      - name: Run m3e doctor (config + zero-hardcoded-CJK check)
        run: pnpm m3e:doctor

      - name: Typecheck all packages
        run: pnpm typecheck

      - name: Run Vitest unit & DOM test suite
        run: pnpm test
