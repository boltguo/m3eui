<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Material 3 Expressive React component library built on @base-ui/react."
    />
    <meta property="og:title" content="m3eui" />
    <meta
      property="og:description"
      content="Material 3 Expressive React component library built on @base-ui/react."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      try {
        const stored = localStorage.getItem("m3e-color-scheme");
        if (stored === "light" || stored === "dark") {
          document.querySelector('meta[name="color-scheme"]').content = stored;
        }
      } catch {}
    </script>
    <title>m3eui — Material 3 Expressive React UI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
