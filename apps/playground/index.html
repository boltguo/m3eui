<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Material 3 Expressive React component library built on @base-ui/react."
    />
    <meta property="og:title" content="m3eui" />
    <meta
      property="og:description"
      content="Material 3 Expressive React component library built on @base-ui/react."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try {
        var s = localStorage.getItem("m3e-color-scheme"),
          m = s === "light" || s === "dark" || s === "system" ? s : "system",
          c = m === "system" ? "light dark" : m,
          d = document.documentElement;
        d.dataset.colorMode = m;
        d.style.colorScheme = c;
        var el = document.querySelector('meta[name="color-scheme"]');
        if (el) el.content = c;
      } catch {}
    </script>
    <title>m3eui — Material 3 Expressive React UI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
